name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays: the install check on every system

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check apps packages/core packages/connectors
      - run: uv run mypy
      - run: uv run pytest

  postgres:
    name: Core on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTXT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest packages/core/tests

  models:
    name: Model tests (meaning and speech)
    runs-on: ubuntu-latest
    env:
      BRAIN_TEST_MODELS: ${{ github.workspace }}/.test-models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: .test-models
          key: test-models-bge-small-en-v1.5-whisper-small.en-1
      - run: uv run python scripts/fetch_test_models.py .test-models
      - run: uv run pytest packages/brain/tests/test_semantic.py apps/server/tests/test_captures.py

  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build app
      - name: Start and check health
        run: |
          cp .env.example .env
          docker compose up -d app
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      # Linux enforces ownership on bind mounts: prove an export, a committed Brain change and a
      # restore work with folders the runner's user owns, the containers running as that user.
      - name: Run as the runner's user with folders it owns
        run: scripts/docker-smoke.sh
      - if: always()
        run: docker compose down -v

  install:
    # What a new user does, on each system: install, make a Brain, check it, connect, serve.
    # Windows and macOS minutes cost more on a private repository, so this runs for pull
    # requests, version tags, by hand and weekly, not on every push to main.
    name: Install and connect (${{ matrix.os }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Make a Brain from a demo starter
        run: uv run contxt setup --brain personal
      - name: Check it, including an MCP handshake with the Brain
        run: uv run contxt check
      - name: Print how each AI app connects
        run: uv run contxt connect
      - name: Serve, and answer on the network
        # The server runs from the environment directly, not through `uv run`: a uv process
        # left running holds uv's cache lock, and the cache step after the job then waits
        # for it until it times out. The server stops when this step ends, pass or fail.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          "$bin/contxt" serve --port 8799 --no-worker > serve.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8799/api/health; then exit 0; fi
            sleep 2
          done
          tail -n 40 serve.log
          exit 1
      - name: Every Python test on this system
        if: runner.os != 'Linux' # Linux runs them in the Python job
        run: uv run python -m pytest -q
