[project]
name = "workspace-server"
version = "0.1.0"
description = "The Contxt server: the web app's API, the MCP endpoint for the app's AI work, the worker and the contxt command."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dependencies = [
    "workspace-core",
    "workspace-connectors",
    # documents: read PDFs into text too (uploads, and documents added to distill)
    # embeddings: match by meaning, as the Brain does in every chat (a local model, no
    # service); without it the server would rank context by words alone
    "ai-brain[documents,embeddings]",
    # speech: turn talk and recordings into text on this computer (a local Whisper model,
    # downloaded once at the owner's request; no audio leaves the machine)
    "faster-whisper>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["workspace-core[postgres]"]

[project.scripts]
contxt = "workspace_server.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_server"]
