[project]
name = "workspace-core"
version = "0.1.0"
description = "Domain model, policies and application services of the Local AI Workspace: goals, projects, tasks, runs, context, artifacts, approvals and events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_core"]
